name: Rebuild site

# The site bakes the posts into its image at build time. After a change to
# the posts on main, ask hayone1/codejourney to build and deploy a new image.
#
# Needs the secret SITE_DISPATCH_TOKEN of the environment "site-dispatch": a
# fine-grained GitHub token for the repository hayone1/codejourney with
# "Contents: Read and write". Only the branch main may use the environment,
# so a workflow on another branch cannot read the token.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: site-dispatch
    steps:
      - name: Send content-published to hayone1/codejourney
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/hayone1/codejourney/dispatches \
            -f event_type=content-published \
            -f "client_payload[sha]=${GITHUB_SHA}"
