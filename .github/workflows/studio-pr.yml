name: Studio PR

# Nuxt Studio commits to the `studio` branch. Open a PR into main for review.
on:
  push:
    branches: [studio]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open or reuse PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh pr list --head studio --base main --state open --json number -q '.[].number')" ]; then
            gh pr create --head studio --base main \
              --title "Content updates from Nuxt Studio" \
              --body "Automated PR for edits made in Nuxt Studio."
          fi
